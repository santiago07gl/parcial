<header class="profile">
  <div class="profile__counter">{{ data.number }} <span>HOJA DE VIDA</span></div>
  <div class="profile__identity">
    <div class="profile__avatar" aria-hidden="true">{{ data.initials }}</div>
    <div class="profile__heading">
      <p class="profile__eyebrow">PERFIL PROFESIONAL</p>
      <h2>{{ data.name }}</h2>
      <p class="profile__role">{{ data.role }}</p>
    </div>
  </div>
  <p class="profile__summary">{{ data.summary }}</p>
  <p class="profile__location"><span aria-hidden="true">⌖</span>{{ data.location }}</p>
</header>
